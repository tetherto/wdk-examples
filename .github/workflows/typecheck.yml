name: Typecheck Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 09:00 UTC

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [wdk, wallet-evm, wallet-evm-erc-4337, wallet-solana, wallet-ton, wallet-tron, mcp-toolkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: ${{ matrix.example }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.example }}
