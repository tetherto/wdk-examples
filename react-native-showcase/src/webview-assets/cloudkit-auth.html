<!DOCTYPE html>
<!--
  cloudkit-auth.html

  Loaded inside a modal WebView in the React Native app to obtain a
  CloudKit Web Services token usable against the PRIVATE database.

  IMPORTANT FIX (v2):
  The Apple ID sign-in flow involves a full-page redirect to
  appleid.apple.com and back. When that redirect lands back on this page,
  the WebView reloads it from scratch — meaning any in-memory JS state from
  before the redirect (including listeners on whenUserSignsIn()) is gone.

  The original version used persist:false and relied on whenUserSignsIn()
  resolving inside the SAME page load that started the sign-in — which
  never happens because of the redirect reload. This version instead:

    1. Sets persist: true so CloudKit JS writes a cookie that survives
       the redirect round-trip.
    2. On EVERY page load (including the one after the redirect returns),
       calls setUpAuth() which checks the persisted cookie state.
    3. If setUpAuth() resolves with a non-null userInfo, the user is
       signed in — at that point we call getAuthToken() (our override)
       to retrieve the actual cached token and post it back to RN.

  This makes the flow resilient to the page reload caused by the redirect.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>CloudKit Sign In</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0D1117;
      font-family: -apple-system, system-ui, sans-serif;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #status {
      color: #8B949E;
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }
    #apple-sign-in-button {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }
    #apple-sign-out-button {
      display: none;
    }
  </style>
</head>
<body>
  <div>
    <div id="status">Loading CloudKit…</div>
    <div id="apple-sign-in-button"></div>
    <div id="apple-sign-out-button"></div>
  </div>

  <script>
    function postToRN(type, payload) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: type, payload: payload }));
      }
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    postToRN('html_loaded', { url: window.location.href });

    // Tracks the token captured via putAuthToken(), persisted to
    // localStorage so it survives the redirect-induced page reload too
    // (belt-and-suspenders alongside the cookie-based persist:true).
    function cacheToken(token) {
      try { window.localStorage.setItem('__ck_token__', token); } catch (e) {}
      window.__CK_CACHED_TOKEN__ = token;
    }
    function getCachedToken() {
      if (window.__CK_CACHED_TOKEN__) return window.__CK_CACHED_TOKEN__;
      try { return window.localStorage.getItem('__ck_token__'); } catch (e) { return null; }
    }

    var tokenAlreadySent = false;
    function sendTokenIfAvailable() {
      var token = getCachedToken();
      if (token && !tokenAlreadySent) {
        tokenAlreadySent = true;
        postToRN('token_received', { webAuthToken: token });
      }
      return !!token;
    }

    window.addEventListener('cloudkitloaded', function () {
      try {
        var config = window.__CK_CONFIG__ || {};
        if (!config.containerIdentifier || !config.apiToken) {
          setStatus('Missing CloudKit configuration.');
          postToRN('error', { message: 'Missing containerIdentifier or apiToken' });
          return;
        }

        setStatus('Configuring CloudKit…');

        CloudKit.configure({
          containers: [{
            containerIdentifier: config.containerIdentifier,
            apiTokenAuth: {
              apiToken: config.apiToken,
              // persist:true is required — it writes a cookie that survives
              // the full-page redirect to appleid.apple.com and back.
              // Without this, CloudKit JS has no way to know the user signed
              // in once the page reloads post-redirect.
              persist: true,
              signInButton: { id: 'apple-sign-in-button', theme: 'black' },
              signOutButton: { id: 'apple-sign-out-button', theme: 'black' },
              getAuthToken: function () {
                return getCachedToken();
              },
              putAuthToken: function (token) {
                cacheToken(token);
                sendTokenIfAvailable();
              },
            },
            environment: config.environment || 'development',
          }],
        });

        var container = CloudKit.getDefaultContainer();

        setStatus('Checking sign-in status…');

        // setUpAuth() is called on EVERY page load — including the one
        // that happens right after the Apple ID redirect returns. If the
        // persisted cookie shows the user is signed in, userInfo will be
        // non-null here, even though this is technically a fresh page load.
        container.setUpAuth().then(function (userInfo) {
          if (userInfo) {
            setStatus('Signed in. Finalizing…');
            postToRN('already_signed_in', {
              userRecordName: userInfo.userRecordName || null,
            });
            // Give putAuthToken a moment to have fired internally,
            // then attempt to send whatever token we have cached.
            setTimeout(sendTokenIfAvailable, 300);
          } else {
            setStatus('Please sign in with your Apple ID to continue.');
            postToRN('awaiting_sign_in', {});
          }
        }).catch(function (err) {
          setStatus('Error checking sign-in status.');
          postToRN('error', { message: String(err) });
        });

        // Still listen for whenUserSignsIn in case the sign-in completes
        // WITHOUT a full page reload (e.g. some flows use a popup/iframe
        // internally rather than a top-level redirect).
        container.whenUserSignsIn().then(function (userInfo) {
          setStatus('Signed in successfully.');
          postToRN('sign_in_success', {
            userRecordName: userInfo.userRecordName || null,
          });
          setTimeout(sendTokenIfAvailable, 300);
        }).catch(function (err) {
          postToRN('error', { message: String(err) });
        });

      } catch (e) {
        setStatus('Initialization error.');
        postToRN('error', { message: String(e) });
      }
    });

    // Final fallback: if a token is already cached from a previous load
    // (e.g. localStorage survived but cloudkitloaded handling above is slow),
    // try sending it after a short delay regardless.
    setTimeout(function () {
      sendTokenIfAvailable();
    }, 2000);
  </script>

  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js" async></script>
</body>
</html>
